name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *'   # 05:17 Sydney, after the register's overnight updates
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Fetch live data
        run: python3 fetch.py

      - name: Check the data is sane before it ships
        run: python3 check.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "govwatch-bot"
          git config user.email "noreply@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
